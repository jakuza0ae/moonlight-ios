name: Build iPad IPA

on:
  workflow_dispatch:
  push:
    branches: [ipad-streamdesk]

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and verify arm64 IPA for iOS 12
        run: |
          xcodebuild -version
          BuildScripts/build-ipad-ipa.sh "$RUNNER_TEMP/artifacts"

      - uses: actions/upload-artifact@v4
        with:
          name: StreamDesk-iOS12-unsigned
          path: ${{ runner.temp }}/artifacts/StreamDesk-iOS12-unsigned.ipa
          if-no-files-found: error
