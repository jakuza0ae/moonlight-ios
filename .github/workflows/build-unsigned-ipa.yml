name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - feature/second-monitor

permissions:
  contents: read

jobs:
  build:
    name: iOS 12 Unsigned IPA
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'

      - name: Build unsigned archive
        run: >-
          xcodebuild archive
          -project Moonlight.xcodeproj
          -scheme Moonlight
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/Moonlight.xcarchive"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          IPHONEOS_DEPLOYMENT_TARGET=12.0

      - name: Package IPA
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/Moonlight.xcarchive/Products/Applications/Moonlight.app"
          test -d "$app_path"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$app_path" "$RUNNER_TEMP/Payload/"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/Moonlight-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-iOS12-unsigned
          path: ${{ runner.temp }}/Moonlight-unsigned.ipa
          if-no-files-found: error
